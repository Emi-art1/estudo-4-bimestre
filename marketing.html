<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Marketing – Estudo e quiz</title>
<style>
:root{--bg:#f3f6f4;--card:#fff;--ink:#16302b;--mut:#51655f;--ac:#0f766e;--ac2:#e0f2ef;--q:#fff4d6;--qi:#5c4300;--ln:#cfdcd7;--ok:#d9f2df;--okb:#1a7f3c;--no:#fde0dd;--nob:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10201d;--card:#183029;--ink:#e6f1ee;--mut:#9db5ae;--ac:#4fd1c0;--ac2:#1f4039;--q:#3a3015;--qi:#f3dc9a;--ln:#2d4a43;--ok:#1b4a2c;--okb:#6fdc8c;--no:#4d2420;--nob:#ff9a90}}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Georgia,"Times New Roman",serif}
h1,h2,button,select,.tag{font-family:"Trebuchet MS",Verdana,sans-serif}
header{padding:28px 18px 8px;max-width:820px;margin:auto}
h1{margin:0 0 6px;font-size:1.7rem;line-height:1.2}
header p{margin:0;color:var(--mut)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);padding:10px 18px}
.bar>div{max-width:820px;margin:auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button,select{font-size:.95rem;border:1px solid var(--ln);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 12px;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.tab[aria-selected=true]{background:var(--ac);color:#fff;border-color:var(--ac)}
@media (prefers-color-scheme:dark){.tab[aria-selected=true]{color:#06231f}}
.play{background:var(--ac2);font-weight:700}
main{max-width:820px;margin:auto;padding:14px 18px 60px}
article,.box{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:18px;margin:0 0 16px}
article.on{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
h2{margin:0 0 8px;font-size:1.2rem}
.tag{font-size:.8rem;color:var(--mut);margin-bottom:2px}
article p,.box p{margin:0 0 10px;max-width:70ch}
.ex{border-left:4px solid var(--ac);padding-left:12px;color:var(--mut)}
.q{background:var(--q);color:var(--qi);border-radius:8px;padding:10px 12px}
.opt{display:block;width:100%;text-align:left;margin:0 0 8px;padding:12px 14px;font-size:1rem;font-family:Georgia,serif}
.opt.ok{background:var(--ok);border-color:var(--okb)}
.opt.no{background:var(--no);border-color:var(--nob)}
.fb{margin:10px 0;font-weight:700;font-family:"Trebuchet MS",Verdana,sans-serif}
.big{font-size:2rem;font-weight:700;font-family:"Trebuchet MS",Verdana,sans-serif}
#st{font-size:.9rem;color:var(--mut)}
</style>
</head>
<body>
<header><h1 id="h"></h1><p>Ensino Médio Técnico em Administração, 4º bimestre. Leia, escute ou teste o que aprendeu.</p></header>
<div class="bar"><div>
<button class="tab" role="tab" id="ts">Estudar</button>
<button class="tab" role="tab" id="tq">Quiz</button>
</div><div style="margin-top:8px">
<span id="cs"><button class="play" id="all">▶ Ouvir tudo</button> <button id="pp">⏸ Pausar</button> <button id="stop">⏹ Parar</button></span>
<label id="cq" hidden><input type="checkbox" id="auto"> Ler as perguntas em voz alta</label>
<label>Velocidade <select id="rate"><option value="0.8">Lenta</option><option value="1" selected>Normal</option><option value="1.25">Rápida</option></select></label>
<span id="st" aria-live="polite"></span>
</div></div>
<main id="m"></main>
<script>
const S={"n": "Marketing", "t": [["Métricas e KPIs", "Métricas são números que mostram os resultados de uma campanha. O KPI é o indicador escolhido para acompanhar um objetivo importante. Curtidas, cliques e visualizações são métricas, mas curtidas mostram interação e não garantem inscrições.", "Se o objetivo é conseguir participantes para a feira escolar, o número de inscritos pode ser o KPI.", "Qual a diferença entre métrica e KPI?", ["Na campanha da feira escolar, qual seria o melhor KPI?", "O número de inscritos", "O número de curtidas", "O número de visualizações", "O número de comentários"]], ["Métricas do marketing digital", "Alcance conta pessoas diferentes; impressões contam quantas vezes o conteúdo apareceu; engajamento reúne interações, como curtidas e comentários. CTR é cliques dividido por impressões vezes 100. CPC é gasto dividido por cliques. Conversão é realizar a ação desejada, e page views são visualizações de uma página.", "50 cliques em 1.000 impressões dão CTR de 5%. Se o gasto foi R$ 20, o CPC foi R$ 0,40.", "Como se calculam o CTR e o CPC?", ["50 cliques em 1.000 impressões. Qual é o CTR?", "5%", "50%", "0,5%", "20%"]], ["Ferramentas de análise", "As ferramentas organizam informações e ajudam a descobrir o que funciona nas campanhas e o que precisa melhorar. Google Analytics mostra o comportamento no site, Hootsuite cuida das redes sociais, Semrush analisa buscas e concorrentes, e HubSpot cuida do relacionamento com clientes e da automação.", "Muitas visitas e poucas compras podem indicar dificuldades com o frete, as informações ou o pagamento.", "Para que servem as ferramentas de análise e o que faz cada uma?", ["Qual ferramenta mostra o comportamento das pessoas no site?", "Google Analytics", "Hootsuite", "Semrush", "HubSpot"]], ["Experiência do usuário (UX)", "UX é a experiência que uma pessoa tem ao usar um site, aplicativo, produto ou serviço, e o objetivo é facilitar o que ela precisa fazer. Seus elementos são usabilidade (facilidade), consistência (padrões), feedback (resposta às ações), acessibilidade (atender diferentes necessidades) e personalização.", "No aplicativo de entrega, encontrar a comida, entender o preço e confirmar o pedido sem confusão.", "O que é UX e quais são seus elementos?", ["O que é UX?", "A experiência que a pessoa tem ao usar um site, app, produto ou serviço", "Apenas os botões e menus da tela", "A cor da marca", "O código do aplicativo"]], ["Interface do usuário (UI)", "UI reúne os elementos com os quais a pessoa interage na tela: botões, menus, textos, imagens e formulários. A entrada permite preencher e pesquisar, a navegação ajuda a encontrar seções, as mensagens informam o resultado, e cores e letras precisam facilitar a leitura.", "O coração que muda de cor ao curtir é uma microinteração. UI é a interface; UX é a experiência completa.", "Qual a diferença entre UI e UX?", ["O coração que muda de cor ao curtir é um exemplo de:", "Microinteração", "Landing page", "Omnichannel", "Greenwashing"]], ["Landing page", "É uma página criada para incentivar uma ação específica, como comprar, fazer uma inscrição ou pedir um orçamento. Ela apresenta título, imagem, descrição da oferta e chamada para ação (CTA), e pode incluir um formulário para coletar os dados necessários.", "A página da feira mostra a programação e um botão escrito “Inscreva-se gratuitamente”.", "O que é uma landing page e o que ela contém?", ["O que significa CTA em uma landing page?", "Chamada para ação", "Custo total anual", "Controle de tráfego", "Canal de atendimento"]], ["Marketing de serviços", "Serviços são atividades que atendem a uma necessidade, como uma aula, um corte de cabelo ou um conserto. Têm quatro características: intangibilidade (não é um objeto para guardar), inseparabilidade (realização e consumo podem ocorrer juntos), variabilidade (a qualidade pode mudar) e perecibilidade (um horário vazio não volta).", "No salão, treinamento e organização ajudam a manter a qualidade do atendimento.", "Quais são as quatro características dos serviços?", ["Qual característica diz que um horário vazio no salão não volta?", "Perecibilidade", "Intangibilidade", "Inseparabilidade", "Variabilidade"]], ["Diferenciação e personalização", "Diferenciação é oferecer motivos para o cliente escolher sua empresa. Personalização é adaptar a oferta às necessidades de cada pessoa. Ouvir os clientes, conhecer suas preferências e acompanhar a satisfação ajuda a melhorar o serviço e o relacionamento.", "Uma escola de idiomas se destaca pelo acompanhamento e personaliza as aulas para quem quer viajar ou trabalhar.", "Qual a diferença entre diferenciação e personalização?", ["Adaptar as aulas para quem quer viajar ou trabalhar é um exemplo de:", "Personalização", "Perecibilidade", "Intangibilidade", "Greenwashing"]], ["Plano de marketing", "O plano organiza o que a empresa quer alcançar e como vai agir, e suas escolhas precisam combinar com o objetivo e com o público. Define-se objetivos, público-alvo, concorrentes, posicionamento e estratégias, e acompanham-se os resultados. O plano de serviços detalha atendimento, diferenciação e personalização.", "Um grupo vende chaveiros, escolhe onde divulgar, organiza os pedidos e acompanha as vendas.", "O que deve conter um plano de marketing?", ["O que faz parte de um plano de marketing?", "Objetivos, público-alvo, concorrentes e estratégias", "Somente o logotipo", "Somente contratar um influenciador", "Somente calcular o lucro"]], ["Inteligência artificial e automação", "A IA pode analisar dados, reconhecer padrões e apoiar recomendações ou conteúdos. A automação executa tarefas conforme uma programação. Chatbots podem responder a perguntas frequentes e sistemas automatizados podem confirmar inscrições. Nem toda automação utiliza IA.", "Um chatbot informa o horário da loja, enquanto o sistema envia a confirmação de um pedido automaticamente.", "Qual a diferença entre IA e automação?", ["Qual afirmação é correta?", "Nem toda automação utiliza IA", "Toda automação é IA", "A IA nunca analisa dados", "Chatbots não respondem perguntas"]], ["Marketing de influência", "A empresa faz parceria com um criador de conteúdo que tem conexão com determinado público. Há nano, micro, macro e megainfluenciadores. Ao escolher, observe se o público combina com o produto, se há interação, se o influenciador transmite confiança e como foram suas campanhas anteriores.", "Uma loja esportiva convida um criador de conteúdo sobre corrida. Muitos seguidores, sozinhos, não garantem bons resultados.", "O que observar ao escolher um influenciador?", ["Ao escolher um influenciador, o que deve ser observado?", "Se o público combina com o produto e se há interação", "Somente o número de seguidores", "Somente a cor do perfil", "Somente o valor cobrado"]], ["Realidade aumentada e virtual", "A realidade aumentada (RA) acrescenta elementos digitais ao ambiente real. A realidade virtual (RV) permite explorar um ambiente digital. Essas tecnologias ajudam a conhecer produtos e ambientes antes da compra, diminuindo algumas dúvidas do consumidor.", "RA: ver um sofá virtual na sua sala pela câmera. RV: explorar uma loja digital usando óculos próprios.", "Qual a diferença entre realidade aumentada e realidade virtual?", ["Ver um sofá virtual na sua sala pela câmera do celular é:", "Realidade aumentada", "Realidade virtual", "Omnichannel", "Landing page"]], ["Omnichannel", "É a integração dos canais de uma empresa, como loja física, site, aplicativo e atendimento, de modo que as informações acompanhem o cliente. Os canais precisam trabalhar juntos para dar continuidade à compra e ao atendimento. Ter vários canais, sem conexão entre eles, não basta.", "Escolher um tênis no aplicativo, comprar pela internet e retirar na loja física.", "O que é omnichannel e por que ter vários canais não basta?", ["Escolher o tênis no app, comprar online e retirar na loja ilustra:", "Omnichannel", "Greenwashing", "Perecibilidade", "Crowdsourcing"]], ["Tecnologia no varejo", "Varejo é a venda diretamente ao consumidor. A tecnologia pode facilitar as compras e ajudar a organizar o trabalho: pagamentos digitais agilizam a compra, lives mostram produtos e permitem perguntas, a IA apoia recomendações, e RA e RV ajudam a visualizar produtos. A tecnologia exige investimento e treinamento.", "A loja apresenta mochilas ao vivo e responde dúvidas sobre tamanhos e cores.", "O que é varejo e como a tecnologia ajuda nele?", ["O que é varejo?", "A venda diretamente ao consumidor", "A venda entre fábricas", "A compra de matéria-prima", "A coleta de resíduos"]], ["Sustentabilidade e ESG", "ESG reúne três dimensões: ambiental, social e governança. A empresa precisa cuidar dos impactos de suas atividades e agir com responsabilidade. Ambiental é reduzir desperdícios; social é respeitar trabalhadores e apoiar a comunidade; governança é administrar com honestidade e prestar contas. Pegada de carbono representa emissões ligadas a uma atividade.", "Economizar energia, capacitar jovens e divulgar resultados verdadeiros.", "O que significa cada letra do ESG?", ["O que significa a letra G no ESG?", "Governança", "Gastos", "Gestão de marca", "Garantia"]], ["Greenwashing", "É criar uma imagem de responsabilidade ambiental que não corresponde às práticas da empresa, levando o público a acreditar em benefícios inexistentes. Pergunte o que mudou, quais provas existem e como a empresa explica seus resultados. A falta de informação exige investigação, mas sozinha não comprova engano.", "Uma embalagem chamada de “amiga da natureza” precisa ter seu benefício ambiental explicado e comprovado.", "O que é greenwashing e como desconfiar dele?", ["O que é greenwashing?", "Criar uma imagem ambiental que não corresponde às práticas da empresa", "Reciclar embalagens", "Plantar árvores", "Usar energia limpa"]], ["Apresentação e feedback", "Pitch é uma apresentação curta e objetiva. Na atividade do material, cada grupo tem até seis minutos para explicar seu plano de marketing. A avaliação considera coerência das estratégias, clareza, organização visual e domínio do plano. Feedback é a devolutiva sobre acertos e pontos a melhorar.", "“Vocês explicaram bem o produto, mas precisam mostrar como vão medir a divulgação.” O grupo usa a sugestão para revisar o plano.", "O que é um pitch e como o feedback ajuda?", ["Quanto tempo cada grupo tem para apresentar o plano, segundo o material?", "Até seis minutos", "Até dois minutos", "Até vinte minutos", "Uma hora"]]]},T=S.t,syn=window.speechSynthesis;
const $=i=>document.getElementById(i),m=$('m'),st=$('st');
let mode='s',tok=0,pl=false,pa=false,L=[],k=0,qu=[],qx=0,sc=0,miss=[],cur=null;
$('h').textContent=S.n;
function say(text,done){if(!syn)return;syn.cancel();const my=++tok,u=new SpeechSynthesisUtterance(text);u.lang='pt-BR';u.rate=+$('rate').value;const v=syn.getVoices().find(v=>/^pt-br/i.test(v.lang));if(v)u.voice=v;u.onend=()=>{if(my===tok&&done)done()};syn.speak(u)}
function stop(){tok++;if(syn)syn.cancel();pl=false;pa=false;document.querySelectorAll('article.on').forEach(a=>a.classList.remove('on'));st.textContent='';$('pp').textContent='⏸ Pausar'}
function txt(t){return t[0]+". "+t[1]+" Exemplo: "+t[2]+" Pergunta geral: "+t[3]}
function study(){
 mode='s';stop();$('ts').setAttribute('aria-selected',true);$('tq').setAttribute('aria-selected',false);$('cs').hidden=false;$('cq').hidden=true;
 m.innerHTML=T.map((t,i)=>`<article id="a${i}"><div class="tag">Tema ${i+1} de ${T.length}</div><h2>${t[0]}</h2><p>${t[1]}</p><p class="ex"><b>Exemplo:</b> ${t[2]}</p><p class="q"><b>Pergunta geral:</b> ${t[3]}</p><button data-i="${i}">🔊 Ouvir este tema</button></article>`).join('');
}
function play(list){
 stop();pl=true;L=list;k=0;
 (function nx(){if(!pl||k>=L.length){stop();return}const i=L[k++];
  document.querySelectorAll('article.on').forEach(a=>a.classList.remove('on'));
  const a=$('a'+i);a.classList.add('on');a.scrollIntoView({behavior:'smooth',block:'center'});st.textContent='Lendo tema '+(i+1);
  say(txt(T[i]),nx)})();
}
const sh=a=>a.slice().sort(()=>Math.random()-.5);
function startQ(ids){
 mode='q';stop();$('tq').setAttribute('aria-selected',true);$('ts').setAttribute('aria-selected',false);$('cs').hidden=true;$('cq').hidden=false;
 qu=sh(ids);qx=0;sc=0;miss=[];showQ();
}
function showQ(){
 if(qx>=qu.length)return endQ();
 const i=qu[qx],z=T[i][4],o=sh([1,2,3,4]);cur={i,o,done:false};
 m.innerHTML=`<div class="box"><div class="tag">Pergunta ${qx+1} de ${qu.length} · Acertos: ${sc}</div><h2>${z[0]}</h2>`+
  o.map((j,n)=>`<button class="opt" data-n="${n}">${'ABCD'[n]}) ${z[j]}</button>`).join('')+
  `<div class="fb" id="fb" aria-live="polite"></div><button id="rd">🔊 Ouvir pergunta</button> <button id="nx" hidden>Próxima ▶</button></div>`;
 if($('auto').checked)readQ();
}
function readQ(){const z=T[cur.i][4];say(z[0]+". "+cur.o.map((j,n)=>"Alternativa "+'ABCD'[n]+": "+z[j]).join(". "))}
function answer(n){
 if(cur.done)return;cur.done=true;const z=T[cur.i][4],right=cur.o.indexOf(1),ok=n===right;
 document.querySelectorAll('.opt').forEach((b,x)=>{b.disabled=true;if(x===right){b.classList.add('ok');b.textContent='✓ '+b.textContent}else if(x===n){b.classList.add('no');b.textContent='✗ '+b.textContent}});
 let f;if(ok){sc++;f='Correto!'}else{miss.push(cur.i);f='Não foi dessa vez. Resposta certa: alternativa '+'ABCD'[right]+'. Revise o tema: '+T[cur.i][0]+'.'}
 $('fb').textContent=f;$('nx').hidden=false;$('nx').focus();
 if($('auto').checked)say(f+" Toque em próxima para continuar.");
}
function endQ(){
 stop();const p=Math.round(100*sc/qu.length);
 m.innerHTML=`<div class="box"><div class="tag">Quiz finalizado</div><div class="big">${sc} de ${qu.length} (${p}%)</div><p>${p>=80?'Excelente! Você domina bem esta matéria.':p>=50?'Bom caminho. Revise os temas errados e tente de novo.':'Vale reler a matéria no modo Estudar e refazer o quiz.'}</p>`+
 (miss.length?`<p><b>Temas para revisar:</b></p><ul>${miss.map(i=>`<li>${T[i][0]}</li>`).join('')}</ul><button class="play" id="rm">Refazer só as erradas</button> `:'')+
 `<button id="ra">Refazer tudo</button> <button id="gs">Voltar a estudar</button></div>`;
 if($('auto').checked)say("Quiz finalizado. Você acertou "+sc+" de "+qu.length+".");
}
m.onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.i!==undefined&&syn)play([+b.dataset.i]);
 else if(b.classList.contains('opt'))answer(+b.dataset.n);
 else if(b.id==='nx'){qx++;showQ()}
 else if(b.id==='rd')readQ();
 else if(b.id==='rm')startQ(miss.slice());
 else if(b.id==='ra')startQ(T.map((_,i)=>i));
 else if(b.id==='gs')study();
};
$('ts').onclick=study;$('tq').onclick=()=>startQ(T.map((_,i)=>i));
$('all').onclick=()=>{if(syn)play(T.map((_,i)=>i))};
$('stop').onclick=stop;
$('pp').onclick=function(){if(!pl)return;if(pa){syn.resume();pa=false;this.textContent='⏸ Pausar'}else{syn.pause();pa=true;this.textContent='▶ Continuar'}};
$('rate').onchange=()=>{if(pl&&!pa){const r=L.slice(k-1);play(r)}};
if(!syn)st.textContent='Seu navegador não suporta leitura em voz alta.';
study();
</script>
</body>
</html>
